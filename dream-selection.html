<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepVida — Choose Your Dream Company & Role</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="dashboard.html" class="brand"><span class="brand-mark"></span> PrepVida</a>
  <nav class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="pricing.html">Pricing</a>
  </nav>
</header>

<main class="narrow-shell">
  <div class="eyebrow">Step 1 of 2</div>
  <h1>What are you preparing for?</h1>
  <p>Type any company and any role — every interview question will be shaped around exactly what you enter.</p>

  <div id="status-message" class="status-msg"></div>

  <form id="dream-form">
    <label for="company-input">Dream company</label>
    <input type="text" id="company-input" list="company-suggestions" required placeholder="e.g. Google, Zomato, a local startup, anything">
    <datalist id="company-suggestions"></datalist>

    <label for="role-input">Dream role</label>
    <input type="text" id="role-input" required placeholder="e.g. Software Engineer, Product Manager, Sales Associate">

    <label for="experience-select">Experience level</label>
    <select id="experience-select">
      <option value="fresher">Fresher</option>
      <option value="mid">Mid-level</option>
      <option value="senior">Senior</option>
    </select>

    <button type="submit" class="btn-block">Save & Continue to Interview</button>
  </form>
</main>

<footer class="site-footer">
  <ul class="footer-links">
    <li><a href="terms.html">Terms</a></li>
    <li><a href="privacy.html">Privacy</a></li>
    <li><a href="security.html">Security</a></li>
    <li><a href="status.html">Status</a></li>
    <li><a href="community.html">Community</a></li>
    <li><a href="docs.html">Docs</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="footer-note">© 2026 PrepVida.in Inc. All rights reserved.</div>
</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/dream-selection.js"></script>
</body>
</html>
