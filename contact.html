<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepVida — Contact</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand"><span class="brand-mark"></span> PrepVida</a>
  <nav class="nav-links"><a href="pricing.html">Pricing</a></nav>
</header>

<main class="narrow-shell">
  <div class="eyebrow">Get in touch</div>
  <h1>Contact us</h1>
  <p>Questions, feedback, or issues with your account? Reach us directly at <a href="mailto:hello@prepvida.in">hello@prepvida.in</a>, or send a message below.</p>

  <div id="status-message" class="status-msg"></div>

  <form id="contact-form">
    <label for="name">Full name</label>
    <input type="text" id="name" required placeholder="Your name">

    <label for="email">Email address</label>
    <input type="email" id="email" required placeholder="you@example.com">

    <label for="message">Message</label>
    <textarea id="message" rows="5" required placeholder="How can we help?"></textarea>

    <button type="submit" class="btn-block">Send Enquiry</button>
  </form>
</main>

<footer class="site-footer">
  <ul class="footer-links">
    <li><a href="terms.html">Terms</a></li>
    <li><a href="privacy.html">Privacy</a></li>

    <li><a href="community.html">Community</a></li>
    <li><a href="docs.html">Docs</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="footer-note">© 2026 PrepVida.in Inc. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/contact.js"></script>
</body>
</html>
